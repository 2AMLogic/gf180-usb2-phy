# CI for gf180-usb2-phy.
#
# Scope is deliberate and documented, not accidental: this workflow runs the
# **tool-light** leg only -- `npm run check:ci` (the evidence-record
# linters under verification/ and sim/, the no-network `scripts/test_setup_env.sh`
# regression test for `setup-env.sh`, plus the `klt functional-verification`
# requests for the real PHY modules). None of that needs the gf180mcu PDK,
# only Icarus Verilog + cocotb + klt.
#
# Exactly one gate runs outside `check:ci`: the evidence-record linters are
# re-run with `--require-append-only --base-ref origin/main`, a strict superset
# of the bare invocations inside `npm run lint` and one only CI can perform (it
# needs the fetched origin/main ref). Nothing else runs after `check:ci`. Do
# not add a step that merely repeats a command `check:ci` already ran: this job
# is a single sequential `steps:` list with no `if:` and no
# `continue-on-error:`, so such a step sits after the command it duplicates and
# can only ever be green -- decoration in the checks UI, not a gate, and a
# two-file sync hazard for the flags it copies (issue #359).
#
# `check:all`'s extra leg (`PDK=gf180mcuD klt synthesize`) is NOT run here:
# it needs a fetched gf180mcu PDK, which is a real, recurring cost to
# provision in a hosted runner on every push/PR. That leg stays a local,
# contributor-run step against the pinned environment from
# `scripts/setup-env.sh`, with its result committed as an append-only record
# under `verification/records/` -- see `docs/environment-setup.md` §
# "Why local, not CI, for the PDK-heavy legs" (which named this file, and
# sky130-modexp's `.github/workflows/ci.yml`, as the pattern to port). Do
# not silently drop this comment if you ever add the PDK-heavy leg to CI --
# update `docs/environment-setup.md` in the same change.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Event-aware concurrency (decision on issue #138). Groups are per workflow and
# per event, so a cancelling PR run can never share a group with a push to main
# or a manual run. Only pull_request runs cancel an in-progress run (an obsolete
# PR revision has no value); started push/workflow_dispatch runs always finish
# so every started main-branch verification keeps its verdict. Native
# concurrency still lets a newer *pending* run supersede an older pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-ci:
    name: check:ci (evidence-record lint + functional-verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the append-only evidence-record checks (both
          # verification/check_records.py and sim/check_records.py) diff
          # against the merge-base with origin/main, which a shallow clone
          # cannot resolve.
          fetch-depth: 0

      # cocotb 2.0.1 (pinned below, matching klt's own pin -- see
      # docs/environment-setup.md) refuses to build on Python 3.14+.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Ensure origin/main is available for the append-only base ref
        run: git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog
          iverilog -V | head -1

      - name: Install klayout-tools (klt) + cocotb -- pinned, see docs/environment-setup.md
        run: |
          python3 -m pip install --disable-pip-version-check \
            "klayout-tools==0.9.0" \
            "cocotb==2.0.1"
          klt --version

      # Two gates this step owns, carrying the rationale that used to sit on a
      # duplicate step below it (removed in issue #359). `package.json` is JSON
      # and cannot hold a comment, so the explanation lives here, next to the
      # one step that now runs each command:
      #
      #   * `npm run reuse:check` -> `python3 scripts/reuse-check.py .`
      #     Rule 9 (2am REUSE.md): the vendored copies under rtl/common/ must
      #     still byte-match their reuse.lock.json stamps. Per-repo mode --
      #     no network, no sibling checkout needed (the upstream cross-check
      #     additionally runs when a sky130-usb2-phy checkout is present).
      #
      #   * `npm run lint` -> `python3 scripts/check_artifact_manifests.py
      #     check --tree HEAD`
      #     Stored evidence (issue #237): new corner-run bytes live in the
      #     artifact store, git keeps only manifests. Offline schema check --
      #     no broker in CI; hash verification is `klt artifact verify` from a
      #     fleet worker.
      #
      # If either command ever leaves `check:ci`, add it back as its own step
      # here -- and move its rationale with it -- in the same change.
      - name: npm run check:ci (lint + klt functional-verification)
        run: npm run check:ci

      - name: Evidence-record linters, strict append-only against origin/main
        run: |
          python3 verification/check_records.py --require-append-only --base-ref origin/main
          python3 sim/check_records.py --require-append-only --base-ref origin/main
